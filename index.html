<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS5 SlopKit Launchers</title>
  <link rel="stylesheet" href="main.css?v=final">
</head>
<body>
  <div class="p-2">
    <h1 class="text-center">PS5 SlopKit Launchers</h1>
    <p class="text-center" id="top-bar-text">
      Current Firmware: <span class="fw-bold" id="current-fw">Unknown</span>
      <span class="firmware-stage-note" id="fw-stage-note" hidden></span>
    </p>
  </div>

  <div id="main-content">
    <div id="pre-jb-view" class="selected">
      <a tabindex="0" class="btn fw-bold" id="run-jb"
         href="slopkit/poops.html?go=1&amp;auto=1&amp;production=1&amp;trigger=netcontrol&amp;attempts=8&amp;only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&amp;log=debug&amp;payload=1&amp;v=final">Jailbreak</a>
      <a tabindex="0" class="btn btn-secondary" id="run-sender"
         href="slopkit/poops.html?go=1&amp;auto=1&amp;production=1&amp;trigger=netcontrol&amp;attempts=8&amp;only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&amp;log=debug&amp;payload=1&amp;reuse=1&amp;v=final">Payloads (sender)</a>
      <a tabindex="0" class="btn btn-secondary" id="run-notify"
         href="notify-launcher.html">Notify launcher</a>
      <p class="text-secondary" id="fw-compat-note" hidden aria-live="polite"></p>
      <p class="text-secondary" id="fw-prereq-note" hidden aria-live="polite"></p>
      <p class="text-secondary" id="fw-support-matrix"></p>
    </div>
  </div>

  <div class="position-relative text-center p-2 mb-2">
    <p class="text-secondary">Credits</p>
    <p class="text-secondary mt-2">Jordy, Egy, Sonic, Yenyen, Zeco, Gezine, Echostretch, Ufm42, TheFloW, John Tornblom, Flatz, Idlesauce and PS5 R&amp;D Discord.</p>
  </div>

  <script src="compatibility.js"></script>
  <script>
const STAGE5_BASE_QUERY = "go=1&auto=1&production=1&trigger=netcontrol&attempts=8&only=ps0_preflight,ps1_prepare,ps3_stage0,ps4_validate,ps5_stage1,ps6_stage2,ps8_stage3,ps9_stage4,ps10_stage5&log=debug&payload=1";
const compat = window.SlopkitCompatibility;
const ROUTE = {
    stage5: `slopkit/poops.html?${STAGE5_BASE_QUERY}&v=final`,
    stage5Reuse: `slopkit/poops.html?${STAGE5_BASE_QUERY}&reuse=1&v=final`,
    notifyLauncher: "notify-launcher.html"
};

function normalizeRoute(route) {
    const url = new URL(route, window.location.href);
    return `${url.pathname}${url.search}`;
}

function isCanonicalRoute(route, expected) {
    return normalizeRoute(route) === normalizeRoute(expected);
}

function disableAction(link, label, title) {
    if (!link) return;
    link.textContent = label;
    link.title = title || "";
    link.removeAttribute("href");
    link.setAttribute("aria-disabled", "true");
    link.setAttribute("aria-describedby", "fw-compat-note");
    link.setAttribute("tabindex", "-1");
}

function bindCanonicalRoute(link, expectedRoute, shouldBlock) {
    if (!link) return;
    const handleActivation = function (event) {
        if (event.type === "keydown" && event.key !== "Enter" && event.key !== " ") {
            return;
        }
        if (event.type === "keydown" && event.key === " ") {
            event.preventDefault();
        }
        if (typeof shouldBlock === "function" && shouldBlock()) {
            event.preventDefault();
            return;
        }
        const currentHref = link.getAttribute("href") || "";
        if (!currentHref) {
            event.preventDefault();
            return;
        }
        if (!isCanonicalRoute(currentHref, expectedRoute)) {
            event.preventDefault();
            link.href = expectedRoute;
            return;
        }
        link.href = expectedRoute;
    };
    link.addEventListener("click", handleActivation);
    link.addEventListener("keydown", handleActivation);
}

function setActionState(link, config) {
    if (!link) return;
    link.textContent = config.label;
    link.title = config.title || "";
    if (config.disabled) {
        disableAction(link, config.label, config.title);
        return;
    }
    link.href = config.href;
    link.removeAttribute("aria-disabled");
    link.removeAttribute("aria-describedby");
    link.setAttribute("tabindex", "0");
}

function runCompatibilitySelfChecks() {
    const stateChecks = [
        ["9.00", "full"],
        ["12.00", "full"],
        ["13.00", "full"],
        ["13.10", "unsupported"],
        ["13.40", "notify"],
        ["8.99", "unsupported"],
        ["", "unknown"]
    ];
    for (const [firmware, expected] of stateChecks) {
        if (compat.firmwareStateFromVersion(firmware) !== expected) {
            throw new Error(`Firmware state self-check failed for ${firmware || "empty"}`);
        }
    }
    if (!isCanonicalRoute(ROUTE.stage5Reuse, ROUTE.stage5Reuse)
        || !isCanonicalRoute(ROUTE.stage5, ROUTE.stage5)
        || !isCanonicalRoute(ROUTE.notifyLauncher, ROUTE.notifyLauncher)) {
        throw new Error("Route canonical self-check failed");
    }
}

try {
    runCompatibilitySelfChecks();
    var firmwareMatch = /PlayStation 5\/(\d+\.\d+)/.exec(navigator.userAgent);
    var firmware = firmwareMatch ? firmwareMatch[1] : "";
    var runJb = document.getElementById("run-jb");
    var runSender = document.getElementById("run-sender");
    var runNotify = document.getElementById("run-notify");
    var firmwareNote = document.getElementById("fw-compat-note");
    var firmwareStageNote = document.getElementById("fw-stage-note");
    var prereqNote = document.getElementById("fw-prereq-note");
    var supportMatrix = document.getElementById("fw-support-matrix");
    var firmwareState = compat.firmwareStateFromVersion(firmware);

    document.getElementById("current-fw").textContent = firmware || "Not detected";
    if (supportMatrix) {
        supportMatrix.textContent = compat.texts.supportMatrix;
    }

    if (firmwareNote) {
        firmwareNote.hidden = true;
        firmwareNote.textContent = "";
    }
    if (firmwareStageNote) {
        firmwareStageNote.hidden = true;
        firmwareStageNote.textContent = "";
    }
    if (prereqNote) {
        prereqNote.hidden = false;
        prereqNote.textContent = "Prerequisites: stable internet, keep browser open during execution, reboot and retry after failures.";
    }

    setActionState(runNotify, { href: ROUTE.notifyLauncher, label: "Notify launcher" });

    if (firmwareState === "full") {
        setActionState(runJb, { href: ROUTE.stage5, label: "Jailbreak" });
        setActionState(runSender, { href: ROUTE.stage5Reuse, label: "Payloads (sender)" });
    } else {
        setActionState(runJb, {
            disabled: true,
            label: "Jailbreak unavailable",
            title: "This firmware is outside the supported jailbreak range (9.00-13.00)."
        });
        setActionState(runSender, {
            disabled: true,
            label: "Payloads unavailable",
            title: "This firmware is outside the supported jailbreak range (9.00-13.00)."
        });
        if (firmwareNote) {
            firmwareNote.hidden = false;
            firmwareNote.textContent = firmwareState === "notify"
                ? "This firmware is supported by the notify launcher only. Use the Notify launcher button."
                : firmwareState === "unknown"
                    ? "Firmware not detected. Manual confirmation required: jailbreak supports 9.00-13.00 and notify supports 9.00-13.60."
                    : "Unsupported firmware detected. Supported ranges: jailbreak 9.00-13.00, notify 9.00-13.60.";
        }
    }

    bindCanonicalRoute(runJb, ROUTE.stage5, function () {
        return runJb.getAttribute("aria-disabled") === "true";
    });
    bindCanonicalRoute(runSender, ROUTE.stage5Reuse, function () {
        return runSender.getAttribute("aria-disabled") === "true" || firmwareState !== "full";
    });
    bindCanonicalRoute(runNotify, ROUTE.notifyLauncher);
} catch (e) {
    console.error("Firmware compatibility error:", e);
    disableAction(document.getElementById("run-jb"), "Jailbreak unavailable", "Compatibility checks failed.");
    disableAction(document.getElementById("run-sender"), "Payloads unavailable", "Compatibility checks failed.");
    disableAction(document.getElementById("run-notify"), "Notify launcher unavailable", "Compatibility checks failed.");
    var failNote = document.getElementById("fw-compat-note");
    if (failNote) {
        failNote.hidden = false;
        failNote.textContent = "Compatibility checks failed. Refresh the page before launching any flow.";
    }
}
</script>
</body>
</html>
